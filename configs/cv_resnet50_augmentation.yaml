# DermaSense CV ResNet-50 Spatial Augmentation Configuration v1.0

experiment:
  name: isic2019_resnet50_augmentation
  architecture: CV_MODEL_ARCHITECTURE_v1.0
  seed: 42

dataset:
  id: isic2019
  train_split: train
  val_split: val
  test_split: test

model:
  backbone: resnet50
  pretrained: true
  dropout: 0.0

transforms:
  image_size: 224
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotation_degrees: 30.0

  random_resized_crop_enabled: true
  random_resized_crop_scale_min: 0.7
  random_resized_crop_scale_max: 1.0

  color_jitter_brightness: 0.10
  color_jitter_contrast: 0.10
  color_jitter_saturation: 0.10
  color_jitter_hue: 0.02

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: null

optimizer:
  name: adamw

scheduler:
  name: none

runtime:
  device: auto
  num_workers: 4
  pin_memory: true

evaluation:
  primary_metric: macro_f1
  use_test_during_training: false

checkpoint:
  directory: checkpoints
  filename: isic2019_resnet50_augmentation_best.pt
